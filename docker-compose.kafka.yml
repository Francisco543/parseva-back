services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: invoicely-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,OUTSIDE://localhost:9092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:19092"
      - "9644:9644"
  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: invoicely-redpanda-console
    depends_on:
      redpanda:
        condition: service_started
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
